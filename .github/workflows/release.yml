name: Release Addon

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned library tag
        id: pin
        run: echo "tag=$(python3 tools/library_tag.py)" >> "$GITHUB_OUTPUT"

      - name: Checkout auth0-ciam-client
        uses: actions/checkout@v4
        with:
          repository: brianpatrickreavey/auth0-ciam-client
          ref: ${{ steps.pin.outputs.tag }}
          path: auth0-ciam-client-src

      - name: Create ZIP
        run: bash tools/build_addon_zip.sh auth0-ciam-client-src ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: script.module.auth0-ciam-client-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Dispatch to Central Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CENTRAL_PAT }}
          repository: brianpatrickreavey/repository.kodi.reavey05.com
          event-type: addon-release
          client-payload: '{"addon": "script.module.auth0-ciam-client", "tag": "${{ github.ref_name }}"}'